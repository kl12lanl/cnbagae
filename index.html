<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agartime Clone</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Масса: <span id="mass">10</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Адаптация размеров экрана
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Настройки игрового мира
        const WORLD_SIZE = 3000; 
        const FOOD_COUNT = 600;
        const BOT_COUNT = 15;

        // Координаты мыши относительно центра экрана
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX - canvas.width / 2;
            mouseY = e.clientY - canvas.height / 2;
        });

        // Класс базовой клетки (игрок и боты)
        class Cell {
            constructor(x, y, radius, color, name, isBot = true) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.name = name;
                this.isBot = isBot;
                this.vx = 0;
                this.vy = 0;
            }

            get speed() {
                // Чем больше масса, тем медленнее движение
                return Math.max(1.5, 8 - (this.radius * 0.05));
            }

            get mass() {
                return Math.round(this.radius * this.radius * 0.1);
            }

            update() {
                // Ограничение движения границами мира
                this.x = Math.max(this.radius, Math.min(WORLD_SIZE - this.radius, this.x + this.vx));
                this.y = Math.max(this.radius, Math.min(WORLD_SIZE - this.radius, this.y + this.vy));
                
                // Постепенное затухание скорости импульса (например, после разделения)
                this.vx *= 0.95;
                this.vy *= 0.95;
            }

            draw(camX, camY) {
                // Перевод мировых координат в экранные с учетом камеры
                let screenX = this.x - camX + canvas.width / 2;
                let screenY = this.y - camY + canvas.height / 2;

                ctx.beginPath();
                ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

                // Отрисовка имени
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(12, this.radius * 0.3)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText(this.name, screenX, screenY);
                ctx.shadowBlur = 0;
            }
        }

        // Массивы игровых объектов
        let playerPieces = [new Cell(WORLD_SIZE / 2, WORLD_SIZE / 2, 20, '#00ffcc', 'Вы', false)];
        let bots = [];
        let food = [];

        // Генерация цветов
        function getRandomColor() {
            const colors = ['#ff2a6d', '#05d9e8', '#01012b', '#f5a623', '#7ed321', '#b8e986', '#9013fe'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Спавн еды
        function spawnFood() {
            while (food.length < FOOD_COUNT) {
                food.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    radius: 4,
                    color: getRandomColor()
                });
            }
        }

        // Спавн ботов
        function spawnBots() {
            const names = ['АгарМастер', 'Бот_007', 'Rex', 'PVP_Pro', 'WunWun', 'Скрытный', 'Злой_Круг', 'AgartimeKing'];
            while (bots.length < BOT_COUNT) {
                let name = names[Math.floor(Math.random() * names.length)] + ' ' + Math.floor(Math.random()*100);
                bots.push(new Cell(
                    Math.random() * WORLD_SIZE,
                    Math.random() * WORLD_SIZE,
                    Math.random() * 20 + 15,
                    getRandomColor(),
                    name,
                    true
                ));
            }
        }

        spawnFood();
        spawnBots();

        // Механика разделения игрока (клавиша Пробел)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                let newPieces = [];
                playerPieces.forEach(piece => {
                    if (piece.radius >= 30) { // Разделиться можно только если масса позволяет
                        let newRadius = piece.radius / Math.sqrt(2);
                        piece.radius = newRadius;

                        // Направление выстрела новой части
                        let angle = Math.atan2(mouseY, mouseX);
                        if (mouseX === 0 && mouseY === 0) angle = Math.random() * Math.PI * 2;

                        let newPiece = new Cell(piece.x, piece.y, newRadius, piece.color, piece.name, false);
                        
                        // Даем сильный импульс вперед новой части
                        newPiece.vx = Math.cos(angle) * 25;
                        newPiece.vy = Math.sin(angle) * 25;

                        newPieces.push(newPiece);
                    }
                });
                playerPieces = playerPieces.concat(newPieces);
            }
        });

        // Главный игровой цикл
        function gameLoop() {
            // 1. Вычисляем центр камеры (среднее положение всех частей игрока)
            let camX = 0, camY = 0;
            playerPieces.forEach(p => { camX += p.x; camY += p.y; });
            camX /= playerPieces.length;
            camY /= playerPieces.length;

            // Очистка экрана
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Отрисовка сетки поля
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 1;
            let startGridX = Math.floor((camX - canvas.width/2) / 50) * 50;
            let startGridY = Math.floor((camY - canvas.height/2) / 50) * 50;
            
            for (let x = startGridX; x < startGridX + canvas.width + 100; x += 50) {
                if (x < 0 || x > WORLD_SIZE) continue;
                let sx = x - camX + canvas.width / 2;
                ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
            }
            for (let y = startGridY; y < startGridY + canvas.height + 100; y += 50) {
                if (y < 0 || y > WORLD_SIZE) continue;
                let sy = y - camY + canvas.height / 2;
                ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
            }

            // 2. Отрисовка еды
            food.forEach(f => {
                let sx = f.x - camX + canvas.width / 2;
                let sy = f.y - camY + canvas.height / 2;
                if (sx > -10 && sx < canvas.width + 10 && sy > -10 && sy < canvas.height + 10) {
                    ctx.beginPath();
                    ctx.arc(sx, sy, f.radius, 0, Math.PI * 2);
                    ctx.fillStyle = f.color;
                    ctx.fill();
                }
            });

            // 3. Обновление и движение игрока
            let totalMass = 0;
            playerPieces.forEach((piece) => {
                let angle = Math.atan2(mouseY, mouseX);
                let dist = Math.hypot(mouseX, mouseY);
                
                // Если мышка далеко, движемся на полную скорость
                if (dist > 10) {
                    piece.x += Math.cos(angle) * piece.speed;
                    piece.y += Math.sin(angle) * piece.speed;
                }
                
                piece.update();
                totalMass += piece.mass;

                // Поедание еды игроком
                food = food.filter(f => {
                    let d = Math.hypot(piece.x - f.x, piece.y - f.y);
                    if (d < piece.radius) {
                        piece.radius += 0.1; // увеличиваем радиус
                        return false;
                    }
                    return true;
                });
            });

            document.getElementById('mass').innerText = totalMass;

            // Слияние частей игрока обратно со временем
            if (playerPieces.length > 1 && Math.random() < 0.002) {
                let p1 = playerPieces[0];
                let p2 = playerPieces[1];
                p1.radius = Math.hypot(p1.radius, p2.radius);
                playerPieces.splice(1, 1);
            }

            // 4. Обновление и движение ботов
            bots.forEach((bot, bIndex) => {
                // Простая логика ИИ для ботов: ищут ближайшую еду или игрока
                let targetX = bot.x;
                let targetY = bot.y;
                let minDist = 300;

                // Бот проверяет, может ли он съесть игрока
                playerPieces.forEach(piece => {
